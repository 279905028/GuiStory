<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>《毕节，雨停之前》封面候选 · 5 个方向</title>
  <style>
    :root { color-scheme: dark; --bg:#101719; --panel:#182225; --line:#354347; --ink:#edece5; --muted:#aebbbb; --accent:#d7bc85; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); background:var(--bg); font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    a { color:inherit; }
    button { font:inherit; }
    a:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:5px; }
    .page { width:min(1560px,100%); margin:auto; padding:48px 40px 42px; }
    .eyebrow { color:var(--accent); letter-spacing:.17em; font-size:12px; margin:0 0 12px; }
    h1 { font-size:clamp(27px,3.2vw,44px); line-height:1.35; font-weight:550; letter-spacing:.03em; margin:0 0 14px; }
    .intro { color:var(--muted); margin:0; max-width:850px; font-size:14px; }
    .nav { display:flex; flex-wrap:wrap; gap:10px; margin:26px 0 30px; }
    .nav a { padding:7px 14px; border:1px solid var(--line); border-radius:5px; text-decoration:none; font-size:13px; }
    .nav a:hover { border-color:var(--accent); color:var(--accent); }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; align-items:start; }
    .card { margin:0; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--panel); scroll-margin-top:24px; }
    .art { display:block; position:relative; background:#0a1012; cursor:zoom-in; text-decoration:none; }
    .art img { display:block; width:100%; height:auto; }
    .view { position:absolute; bottom:12px; right:12px; background:#101719de; padding:4px 10px; border:1px solid #ffffff28; border-radius:4px; color:#edece5; font-size:11px; pointer-events:none; }
    figcaption { padding:18px 20px 20px; }
    .label { display:flex; align-items:baseline; gap:12px; }
    .letter { color:var(--accent); font:500 21px/1.3 Georgia,serif; }
    h2 { font-size:19px; font-weight:500; margin:0; letter-spacing:.04em; }
    .description { margin:7px 0 0 29px; font-size:13px; color:var(--muted); }
    footer { border-top:1px solid var(--line); margin-top:34px; padding-top:20px; color:var(--muted); font-size:12px; display:flex; flex-wrap:wrap; gap:8px 22px; justify-content:space-between; }
    footer p { margin:0; }
    footer a { color:var(--accent); text-underline-offset:4px; }
    dialog { width:100vw; max-width:none; height:100dvh; max-height:none; margin:0; padding:60px 24px 24px; border:0; background:#080d10f5; color:var(--ink); }
    dialog::backdrop { background:#080d10f5; }
    .viewer-body { height:100%; display:flex; flex-direction:column; align-items:center; gap:14px; }
    .viewer-title { margin:0; font-size:14px; color:var(--muted); flex:none; }
    .viewer-image { display:block; width:100%; height:calc(100% - 40px); object-fit:contain; }
    .close { position:absolute; right:24px; top:14px; border:1px solid var(--line); border-radius:5px; background:#182225; color:var(--ink); padding:5px 16px; cursor:pointer; }
    .close:hover { border-color:var(--accent); }
    body.viewer-open { overflow:hidden; }
    @media (max-width:900px) { .page { padding:32px 20px; } .grid { grid-template-columns:1fr; gap:20px; } .nav { gap:8px; } .nav a { padding:6px 10px; } }
    @media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <p class="eyebrow">封面候选 / 2026.10.20</p>
      <h1>毕节，雨停之前</h1>
      <p class="intro">5 个封面方向，点击图片可完整放大查看。文文为主角，毛狼与师匠共同出现；五位人形女主与球形黄球球均以剪影呈现。</p>
      <nav class="nav" aria-label="跳转至候选">
        <a href="#option-a">A · 老街雨夜</a>
        <a href="#option-b">B · 河桥暮色</a>
        <a href="#option-c">C · 树荫旧院</a>
        <a href="#option-d">D · 木楼听雨</a>
        <a href="#option-e">E · 坡巷归途</a>
      </nav>
    </header>
    <section class="grid" aria-label="五张封面候选图">
      <figure class="card" id="option-a">
        <a class="art" href="option-A-rainy-market.png" data-title="A · 老街雨夜" aria-label="放大 A：老街雨夜">
          <img src="option-A-rainy-market.png" alt="A 版封面候选：老街雨夜" loading="eager">
          <span class="view" aria-hidden="true">点击放大 ↗</span>
        </a>
        <figcaption><div class="label"><span class="letter">A</span><h2>老街雨夜</h2></div><p class="description">湿润街面与夜灯交织，让重逢停在一场未尽的雨里。</p></figcaption>
      </figure>
      <figure class="card" id="option-b">
        <a class="art" href="option-B-river-dusk.png" data-title="B · 河桥暮色" aria-label="放大 B：河桥暮色">
          <img src="option-B-river-dusk.png" alt="B 版封面候选：河桥暮色" loading="eager">
          <span class="view" aria-hidden="true">点击放大 ↗</span>
        </a>
        <figcaption><div class="label"><span class="letter">B</span><h2>河桥暮色</h2></div><p class="description">河面倒影承接将晚的天色，留下一段安静而开阔的距离。</p></figcaption>
      </figure>
      <figure class="card" id="option-c">
        <a class="art" href="option-C-green-courtyard.png" data-title="C · 树荫旧院" aria-label="放大 C：树荫旧院">
          <img src="option-C-green-courtyard.png" alt="C 版封面候选：树荫旧院" loading="lazy">
          <span class="view" aria-hidden="true">点击放大 ↗</span>
        </a>
        <figcaption><div class="label"><span class="letter">C</span><h2>树荫旧院</h2></div><p class="description">旧院与浓绿树荫收住喧闹，呈现更温柔、贴近日常的相遇。</p></figcaption>
      </figure>
      <figure class="card" id="option-d">
        <a class="art" href="option-D-timber-rain.png" data-title="D · 木楼听雨" aria-label="放大 D：木楼听雨">
          <img src="option-D-timber-rain.png" alt="D 版封面候选：木楼听雨" loading="lazy">
          <span class="view" aria-hidden="true">点击放大 ↗</span>
        </a>
        <figcaption><div class="label"><span class="letter">D</span><h2>木楼听雨</h2></div><p class="description">木楼檐下的雨声与柔光，让人物关系在近处缓缓展开。</p></figcaption>
      </figure>
      <figure class="card" id="option-e">
        <a class="art" href="option-E-sloping-lane.png" data-title="E · 坡巷归途" aria-label="放大 E：坡巷归途">
          <img src="option-E-sloping-lane.png" alt="E 版封面候选：坡巷归途" loading="lazy">
          <span class="view" aria-hidden="true">点击放大 ↗</span>
        </a>
        <figcaption><div class="label"><span class="letter">E</span><h2>坡巷归途</h2></div><p class="description">沿起伏街巷望向归途，把返乡、同行与选择留在画面深处。</p></figcaption>
      </figure>
    </section>
    <footer>
      <p>当前为待选候选，尚未接入游戏或部署。</p>
      <p> · <a href="prompts.json">查看生成提示词</a></p>
    </footer>
  </main>
  <dialog id="viewer" aria-labelledby="viewer-title">
    <button class="close" type="button" aria-label="关闭放大预览">关闭 ×</button>
    <div class="viewer-body"><p class="viewer-title" id="viewer-title"></p><img class="viewer-image" alt=""></div>
  </dialog>
  <script>
    (() => {
      const viewer = document.querySelector('#viewer');
      if (typeof viewer.showModal !== 'function') return;
      const image = viewer.querySelector('img');
      const title = viewer.querySelector('#viewer-title');
      document.querySelectorAll('.art').forEach(link => {
        link.addEventListener('click', event => {
          event.preventDefault();
          image.src = link.getAttribute('href');
          image.alt = link.querySelector('img').alt;
          title.textContent = link.dataset.title;
          document.body.classList.add('viewer-open');
          viewer.showModal();
        });
      });
      viewer.querySelector('.close').addEventListener('click', () => viewer.close());
      viewer.addEventListener('click', event => { if (event.target === viewer) viewer.close(); });
      viewer.addEventListener('close', () => document.body.classList.remove('viewer-open'));
    })();
  </script>
</body>
</html>
