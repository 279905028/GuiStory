<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>M3 脸部造型优化对比</title><style>*{box-sizing:border-box}body{margin:0;background:#182126;color:#eff3f4;font:16px/1.6 -apple-system,BlinkMacSystemFont,sans-serif}main{width:1160px;margin:auto;padding:24px}h1{font-size:25px;margin:0}p{margin:5px 0 20px;color:#b9c6cb}.row{display:grid;grid-template-columns:170px 1fr 1fr;gap:18px;align-items:center;margin:20px 0}.title b{font-size:22px}.title span{display:block;color:#aab9c0;font-size:14px}.card{border:1px solid #46545d;border-radius:10px;overflow:hidden;background:#ced6dc}.label{background:#28363f;color:#d9e3e8;padding:8px 14px}canvas{display:block;width:100%;height:350px;object-fit:contain}.note{margin:20px 0 0;font-size:14px;color:#b9c6cb}</style><main><h1>毛狼、师匠 · 脸部造型优化</h1><p>同一角色前后对照；局部由浏览器渲染，不改变源文件像素。</p><div id="rows"></div><p class="note">黄球球沿用参考造型与原版透明素材；本次脸部修改对象为两位男配。</p></main><script>
window.qaReady=(async()=>{for(const [key,name,age,crop] of [['maolang','毛狼','24岁 · 机灵损友',[300,10,440,460]],['shijiang','师匠','32岁 · 维修前辈',[270,10,440,470]]]){const row=document.createElement('div');row.className='row';row.innerHTML=`<div class="title"><b>${name}</b><span>${age}</span></div>`;document.querySelector('#rows').append(row);for(const v of [1,2]){const img=new Image();img.src=`../assets/new-character-variants/${key}-v${v}.png`;await img.decode();const card=document.createElement('div');card.className='card';card.innerHTML=`<div class="label">${v===1?'优化前 · v1':'优化后 · v2'}</div>`;const c=document.createElement('canvas');c.width=440;c.height=350;const g=c.getContext('2d');g.fillStyle='#ced6dc';g.fillRect(0,0,440,350);const factor=img.naturalWidth/1024;const box=crop.map(n=>n*factor);const sc=Math.min(420/box[2],340/box[3]);g.drawImage(img,...box,(440-box[2]*sc)/2,(350-box[3]*sc)/2,box[2]*sc,box[3]*sc);card.append(c);row.append(card);}}})();
</script></html>
