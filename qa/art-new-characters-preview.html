<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M3 新角色美术验收 · R2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171c20;color:#e5e7e8;font:15px/1.6 -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:1440px;margin:auto;padding:28px}h1{font-size:26px;margin:0 0 6px}h2{font-size:19px;margin:32px 0 12px}p{color:#afb9be;margin:5px 0 16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{border:1px solid #3c484e;border-radius:12px;overflow:hidden;background:#242c31}.caption{padding:12px 16px}b{display:block;font-size:18px}.caption span{font-size:13px;color:#aeb9bd}.checker{background-color:#c6ccd0;background-image:conic-gradient(#e5e8ea 25%,transparent 0 50%,#e5e8ea 0 75%,transparent 0);background-size:28px 28px}.sprite{width:100%;height:540px;object-fit:contain;display:block}.sprite.orb{padding:28px}.stage{position:relative;aspect-ratio:16/10;overflow:hidden;background-size:cover;background-position:center}.stage img{position:absolute;height:94%;width:62%;object-fit:contain;object-position:bottom;left:19%;bottom:0}.stage img.orb{width:54%;height:auto;aspect-ratio:1;left:23%;bottom:13%;object-position:center}.badge{position:absolute;top:8px;left:10px;background:#101a20cd;padding:3px 9px;border-radius:6px;font-size:12px}.stages{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.avatar-row{display:flex;align-items:center;gap:24px;padding:22px}.avatar{display:inline-flex;align-items:center;justify-content:center;border:1px solid #66737a;background:#303b43;border-radius:50%;padding:7%;aspect-ratio:1}.avatar img{width:100%;height:100%;object-fit:contain}.avatar-box{text-align:center}.note{border-left:3px solid #c99f57;padding-left:12px}.edge-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.edge{height:500px;display:flex;align-items:center;justify-content:center;overflow:hidden}.edge img{height:96%;width:96%;object-fit:contain}.light{background:#fafafa}.dark{background:#071017}footer{margin-top:28px;color:#9aadb5}
</style>
<main><h1>《毕节，雨停之前》新增三角色</h1><p>R2 · M3 美术预览与合成检查；仅展示素材，不代表游戏接入结果。</p><div id="preview" class="grid"></div><h2>现有明暗背景合成</h2><p>亮背景：维修柜台 bg-repair.png；暗背景：空包厢 bg-room.png。图片按原比例显示。</p><div id="composites"></div><h2>额外黑白底边缘检查</h2><div id="edges"></div><h2>黄球球头像尺寸检查</h2><div id="avatars" class="avatar-row"></div><p class="note">黄球球的立绘、收束图与头像均使用正方形容器和 contain；不拉长，不使用人类胸像裁切。圆形头像容器内留白以保留托腮小手。这里的布局仅用于素材 QA。</p><footer>原始角色、背景及黄球球用户参考均只读；最终接入、隐藏入口与存档验证由 E3/E4/E5 执行。</footer></main>
<script>
const chars=[['maolang','毛狼','24 岁 · human'],['shijiang','师匠','32 岁 · human'],['huangqiuqiu','黄球球','自称 24 岁 · orb']];
const variantVersion=new URLSearchParams(location.search).get('variants');
const dir=variantVersion?'../assets/new-character-variants/':'../assets/';
const candidateVersion=k=>k==='huangqiuqiu'?'1':variantVersion==='3'&&k==='maolang'?'2':variantVersion;
const src=k=>dir+(variantVersion?k+'-v'+candidateVersion(k)+'.png':'char-'+k+'.png');
for(const [key,name,desc] of chars){const orb=key==='huangqiuqiu'?'orb':'';document.querySelector('#preview').insertAdjacentHTML('beforeend',`<section class="card" id="preview-${key}"><div class="checker"><img class="sprite ${orb}" src="${src(key)}"></div><div class="caption"><b>${name}</b><span>${desc}</span></div></section>`);document.querySelector('#composites').insertAdjacentHTML('beforeend',`<section id="composite-${key}"><h2>${name}</h2><div class="stages">${[['repair','较亮 · 维修柜台'],['room','较暗 · 空包厢']].map(([b,l])=>`<div class="stage" style="background-image:url('../assets/bg-${b}.png')"><img class="${orb}" src="${src(key)}"><span class="badge">${l}</span></div>`).join('')}</div></section>`);document.querySelector('#edges').insertAdjacentHTML('beforeend',`<section id="edge-${key}"><h2>${name}</h2><div class="edge-row"><div class="edge light"><img src="${src(key)}"></div><div class="edge dark"><img src="${src(key)}"></div></div></section>`);}
for(const size of [48,64,96,160])document.querySelector('#avatars').insertAdjacentHTML('beforeend',`<div class="avatar-box"><div class="avatar" style="width:${size}px;height:${size}px;padding:${Math.round(size*.08)}px"><img src="${src('huangqiuqiu')}"></div><p>${size} px</p></div>`);
window.qaReady=Promise.all([...document.images].map(i=>i.decode().catch(()=>{}))).then(()=>{
 const cuts={maolang:[['脸部',[330,80,360,380]],['自然垂手',[132,1240,170,250]],['发丝轮廓',[320,20,210,240]],['外套边缘',[810,490,180,330]]],shijiang:[['脸部及眼镜',[300,120,330,340]],['垂手',[90,1240,175,255]],['胸前小工具',[600,560,110,200]],['袖口边缘',[820,750,180,330]]],huangqiuqiu:[['忧虑眉与圆眼',[280,380,700,410]],['托腮小手',[610,880,390,330]],['球体左缘',[25,500,180,240]],['球体顶缘',[430,50,360,150]]]};
 const main=document.querySelector('main');for(const [key,name] of chars){const section=document.createElement('section');section.id='details-'+key;section.innerHTML=`<h2>${name} · 局部检查</h2><p>仅浏览器截取查看局部；不修改素材像素。上排浅底，下排深底。</p>`;const grid=document.createElement('div');grid.style.cssText='display:grid;grid-template-columns:repeat(4,1fr);gap:10px';const img=document.querySelector('#preview-'+key+' img');for(const base of ['#fafafa','#071017'])for(const [label,box] of cuts[key]){const d=document.createElement('div');d.innerHTML='<p>'+label+'</p>';const c=document.createElement('canvas');c.width=320;c.height=320;c.style.cssText='display:block;width:100%;aspect-ratio:1';const g=c.getContext('2d');g.fillStyle=base;g.fillRect(0,0,320,320);const s=Math.min(304/box[2],304/box[3]);g.drawImage(img,...box,(320-box[2]*s)/2,(320-box[3]*s)/2,box[2]*s,box[3]*s);d.append(c);grid.append(d);}section.append(grid);main.append(section);}
});
</script></html>
