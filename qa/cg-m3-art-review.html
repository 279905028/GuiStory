<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CG素材静态检查</title><style>*{box-sizing:border-box}body{margin:0;height:100dvh;overflow:hidden;background:#101b20;color:#eee8dc;font:14px/1.5 system-ui;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header{padding:10px 14px;border-bottom:1px solid #6b6650;display:flex;gap:8px;flex-wrap:wrap;align-items:center}header p{margin:0;font-size:12px;color:#c7c2ae}select{min-height:44px;color:inherit;background:#26333a;border:1px solid #82785b;padding:6px;max-width:100%}main{position:relative;min-height:0;background:#080e12;overflow:hidden;display:flex;align-items:center;justify-content:center}img{width:100%;height:100%;object-fit:contain;display:block}footer{padding:10px 14px;border-top:1px solid #6b6650;background:#17282e}h1{font-size:16px;margin:0 0 4px}footer p{margin:3px 0;font-size:13px}.note{font-size:11px;color:#c9bf9d}#danger{display:none;position:absolute;bottom:0;left:0;right:0;height:35%;background:#c6373755;pointer-events:none;border-top:1px dashed #ec9b8e}body.diagnose #danger{display:block}label{min-height:32px;display:flex;gap:6px;align-items:center;font-size:11px}#notice{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}#notice[hidden]{display:none}@media(max-height:500px){header{padding:4px 10px}header p{font-size:10px}select{min-height:36px}footer{padding:5px 10px}footer p{font-size:11px}h1{font-size:13px}}</style><header><select id="choose" aria-label="选择CG"></select><p>CG-M3 · 静态素材检查，非游戏画面</p><label><input id="overlay" type="checkbox">底部35%遮挡诊断</label></header><main><img id="art" alt=""><div id="danger"></div><p id="notice" hidden>素材尚未生成</p></main><footer><h1 id="name"></h1><p id="line"></p><p class="note" id="meta"></p><p class="note">完整等比显示｜未运行剧情、播放器或正式界面</p></footer><script>const DATA=[{"id":"CG08","title":"先听你说完","file":"cg-08-huangqiuqiu-listening.png","node":"preview_qiu_12","text":"我把布叠到椅背上，拉开椅子坐下。她仍托着腮，圆球轻轻偏过来，看我坐稳。"}];const sel=document.getElementById('choose'),art=document.getElementById('art');for(const d of DATA){const o=document.createElement('option');o.value=d.id;o.textContent=d.id+' '+d.title;sel.append(o)}function render(){const d=DATA.find(x=>x.id===sel.value);document.getElementById('name').textContent=d.id+' '+d.title;document.getElementById('line').textContent=d.text;document.getElementById('meta').textContent=d.node+' · 载入中';document.getElementById('notice').hidden=true;art.alt=d.id+' '+d.title;art.src='../assets/cg/'+d.file}art.onload=()=>{document.getElementById('meta').textContent=DATA.find(x=>x.id===sel.value).node+' · 原图 '+art.naturalWidth+'×'+art.naturalHeight+' · object-fit:contain'};art.onerror=()=>{document.getElementById('notice').hidden=false};sel.onchange=render;document.getElementById('overlay').onchange=e=>document.body.classList.toggle('diagnose',e.target.checked);render();</script></html>
